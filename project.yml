name: CashbackCopilot
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.azat.cashbackcopilot
attributes:
  ORGANIZATIONNAME: Azat
targets:
  CashbackCopilot:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Features
      - Shared
    resources:
      - Resources
    dependencies:
      - target: CashbackCopilotQuickLaunchWidget
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Cashback Copilot
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.azat.cashbackcopilot
            CFBundleURLSchemes:
              - cashbackcopilot
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Нужен доступ к камере, чтобы сканировать QR-код оплаты.
    settings:
      base:
        PRODUCT_NAME: CashbackCopilot
        PRODUCT_MODULE_NAME: CashbackCopilot
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
  CashbackCopilotQuickLaunchWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widgets/QuickLaunch
    info:
      path: Widgets/QuickLaunch/Info.plist
      properties:
        CFBundleDisplayName: Cashback Quick Launch
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: CashbackQuickLaunchWidget
        PRODUCT_MODULE_NAME: CashbackCopilotQuickLaunchWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.azat.cashbackcopilot.quicklaunchwidget
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  CashbackCopilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CashbackCopilotTests
    dependencies:
      - target: CashbackCopilot
    settings:
      base:
        PRODUCT_NAME: CashbackCopilotTests
        PRODUCT_MODULE_NAME: CashbackCopilotTests
        PRODUCT_BUNDLE_IDENTIFIER: com.azat.cashbackcopilot.tests
        GENERATE_INFOPLIST_FILE: YES
  CashbackCopilotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CashbackCopilotUITests
    dependencies:
      - target: CashbackCopilot
    settings:
      base:
        PRODUCT_NAME: CashbackCopilotUITests
        PRODUCT_MODULE_NAME: CashbackCopilotUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.azat.cashbackcopilot.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CashbackCopilot:
    build:
      targets:
        CashbackCopilot: all
        CashbackCopilotTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: CashbackCopilotTests
  CashbackCopilotUI:
    build:
      targets:
        CashbackCopilot: all
        CashbackCopilotUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: CashbackCopilotUITests
